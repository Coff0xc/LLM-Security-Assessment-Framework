# Grafana 仪表板配置
# 自动加载 FORGEDAN 仪表板

apiVersion: 1

providers:
  - name: 'FORGEDAN Dashboards'
    orgId: 1
    folder: 'FORGEDAN'
    folderUid: 'forgedan-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
