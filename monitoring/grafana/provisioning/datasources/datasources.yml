# Grafana data source configuration
# Automatically configures the Prometheus data source

apiVersion: 1

datasources:
  # Prometheus data source
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: "2.45.0"
      timeInterval: "15s"
      # Enable Exemplars
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
