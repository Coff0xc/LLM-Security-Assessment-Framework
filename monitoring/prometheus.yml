# Prometheus configuration file
# For monitoring the FORGEDAN LLM security assessment framework

global:
  # Global scrape interval
  scrape_interval: 15s
  # Global evaluation interval
  evaluation_interval: 15s
  # External labels
  external_labels:
    monitor: 'forgedan-monitor'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Alert rule files
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Scrape configuration
scrape_configs:
  # Prometheus's own metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scheme: http

  # FORGEDAN web application metrics
  - job_name: 'forgedan-web'
    static_configs:
      - targets: ['host.docker.internal:5000']
        labels:
          instance: 'forgedan-web'
          service: 'forgedan'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 10s
    scrape_timeout: 5s

  # FORGEDAN standalone metrics exporter
  - job_name: 'forgedan-exporter'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          instance: 'forgedan-exporter'
          service: 'forgedan'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 5s
    scrape_timeout: 3s

  # Push Gateway (for batch jobs)
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
    metrics_path: /metrics
    scheme: http

# Remote write configuration (optional, for long-term storage)
