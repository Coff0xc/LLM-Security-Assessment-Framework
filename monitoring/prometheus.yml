# Prometheus 配置文件
# 用于 FORGEDAN LLM 安全评估框架监控

global:
  # 全局抓取间隔
  scrape_interval: 15s
  # 全局评估间隔
  evaluation_interval: 15s
  # 外部标签
  external_labels:
    monitor: 'forgedan-monitor'
    environment: 'development'

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 告警规则文件
rule_files:
  - "/etc/prometheus/rules/*.yml"

# 抓取配置
scrape_configs:
  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scheme: http

  # FORGEDAN Web 应用指标
  - job_name: 'forgedan-web'
    static_configs:
      - targets: ['host.docker.internal:5000']
        labels:
          instance: 'forgedan-web'
          service: 'forgedan'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 10s
    scrape_timeout: 5s

  # FORGEDAN 独立指标导出器
  - job_name: 'forgedan-exporter'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          instance: 'forgedan-exporter'
          service: 'forgedan'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 5s
    scrape_timeout: 3s

  # Push Gateway (用于批量任务)
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
    metrics_path: /metrics
    scheme: http

# 远程写入配置 (可选，用于长期存储)
