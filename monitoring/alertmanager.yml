# Alertmanager configuration file
# Alert configuration for the FORGEDAN LLM security assessment framework

global:
  # Alert resolution timeout
  resolve_timeout: 5m

# Alert routing
route:
  # Default receiver
  receiver: 'default-receiver'
  # Group wait time
  group_wait: 30s
  # Group interval
  group_interval: 5m
  # Repeat interval
  repeat_interval: 4h
  # Group labels
  group_by: ['alertname', 'severity', 'service']

  # Child routes
  routes:
    # Critical alerts - notify immediately
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h

    # Warnings - normal handling
    - match:
        severity: warning
      receiver: 'warning-receiver'
      repeat_interval: 4h

    # Info - log only
    - match:
        severity: info
      receiver: 'info-receiver'
      repeat_interval: 24h

# Alert inhibition
inhibit_rules:
  # When a critical alert fires, inhibit warning alerts with the same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # When a warning alert fires, inhibit info alerts with the same alertname
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'service']

# Receiver configuration
receivers:
  # Default receiver - log only
  - name: 'default-receiver'
    # Can be configured with webhook, email, Slack, etc.
    # webhook_configs:
    #   - url: 'http://host.docker.internal:5000/api/alerts/webhook'
    #     send_resolved: true

  # Critical alert receiver
  - name: 'critical-receiver'
    # Example: send to Slack
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/xxx/yyy/zzz'
    #     channel: '#forgedan-alerts'
    #     title: '{{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    #     send_resolved: true

    # Example: send an email
    # email_configs:
    #   - to: 'admin@example.com'
    #     from: 'alertmanager@forgedan.local'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alertmanager@example.com'
    #     auth_password: 'password'
    #     send_resolved: true

    # Example: Webhook
    # webhook_configs:
    #   - url: 'http://host.docker.internal:5000/api/alerts/webhook'
    #     send_resolved: true
    #     http_config:
    #       basic_auth:
    #         username: 'forgedan'
    #         password: 'secret'

  # Warning receiver
  - name: 'warning-receiver'
    # Same configuration as above

  # Info receiver
  - name: 'info-receiver'
    # Usually logged only, no notification sent

# Template files (optional)
# templates:
#   - '/etc/alertmanager/templates/*.tmpl'
