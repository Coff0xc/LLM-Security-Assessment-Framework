# Prometheus alert rules
# FORGEDAN LLM security assessment framework

groups:
  - name: forgedan_alerts
    interval: 15s
    rules:
      # High error rate alert
      - alert: HighQueryErrorRate
        expr: |
          sum(rate(forgedan_query_errors_total[5m]))
          /
          sum(rate(forgedan_queries_total[5m]))
          > 0.1
        for: 2m
        labels:
          severity: warning
          service: forgedan
        annotations:
          summary: "LLM query error rate too high"
          description: "Query error rate over the past 5 minutes is {{ $value | humanizePercentage }}"

      # Abnormal attack success rate
      - alert: HighAttackSuccessRate
        expr: |
          sum(rate(forgedan_attacks_success_total[15m]))
          /
          sum(rate(forgedan_attacks_total[15m]))
          > 0.8
        for: 5m
        labels:
          severity: info
          service: forgedan
        annotations:
          summary: "Abnormally high attack success rate"
          description: "Attack success rate reached {{ $value | humanizePercentage }}; the target model may be weakly protected"

      # No active tasks
      - alert: NoActiveTasks
        expr: forgedan_active_tasks{task_type="evolution"} == 0
        for: 30m
        labels:
          severity: info
          service: forgedan
        annotations:
          summary: "No active tasks for a long time"
          description: "No tasks have been running for over 30 minutes"

      # High memory usage
      - alert: HighMemoryUsage
        expr: forgedan_memory_usage_bytes{type="resident"} > 2147483648
        for: 5m
        labels:
          severity: warning
          service: forgedan
        annotations:
          summary: "Memory usage too high"
          description: "Current memory usage is {{ $value | humanize1024 }}B"

      # High CPU usage
      - alert: HighCpuUsage
        expr: forgedan_cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
          service: forgedan
        annotations:
          summary: "CPU usage too high"
          description: "Current CPU usage is {{ $value }}%"

      # High model response latency
      - alert: HighModelLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(forgedan_model_latency_seconds_bucket[5m])) by (le, model)
          ) > 10
        for: 5m
        labels:
          severity: warning
          service: forgedan
        annotations:
          summary: "Model response latency too high"
          description: "P95 latency of model {{ $labels.model }} exceeds 10 seconds"

      # Low cache hit rate
      - alert: LowCacheHitRate
        expr: |
          sum(rate(forgedan_cache_hits_total[5m]))
          /
          (sum(rate(forgedan_cache_hits_total[5m])) + sum(rate(forgedan_cache_misses_total[5m])))
          < 0.3
        for: 10m
        labels:
          severity: info
          service: forgedan
        annotations:
          summary: "Cache hit rate too low"
          description: "Cache hit rate is {{ $value | humanizePercentage }}; consider adjusting the cache strategy"

      # Task execution time too long
      - alert: LongRunningTask
        expr: |
          histogram_quantile(0.95,
            sum(rate(forgedan_task_duration_seconds_bucket[1h])) by (le, task_type)
          ) > 3600
        for: 5m
        labels:
          severity: warning
          service: forgedan
        annotations:
          summary: "Task execution time too long"
          description: "P95 execution time for task type {{ $labels.task_type }} exceeds 1 hour"

  - name: forgedan_recording_rules
    interval: 15s
    rules:
      # Attack success rate
      - record: forgedan:attack_success_rate
        expr: |
          sum(rate(forgedan_attacks_success_total[5m]))
          /
          sum(rate(forgedan_attacks_total[5m]))

      # Query error rate
      - record: forgedan:query_error_rate
        expr: |
          sum(rate(forgedan_query_errors_total[5m]))
          /
          sum(rate(forgedan_queries_total[5m]))

      # Cache hit rate
      - record: forgedan:cache_hit_rate
        expr: |
          sum(rate(forgedan_cache_hits_total[5m]))
          /
          (sum(rate(forgedan_cache_hits_total[5m])) + sum(rate(forgedan_cache_misses_total[5m])))

      # Average model latency
      - record: forgedan:avg_model_latency
        expr: |
          sum(rate(forgedan_model_latency_seconds_sum[5m]))
          /
          sum(rate(forgedan_model_latency_seconds_count[5m]))

      # QPS
      - record: forgedan:queries_per_second
        expr: sum(rate(forgedan_queries_total[1m]))
