name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest tests/ -v --ignore=tests/test_fitness.py -x

    - name: Run suite preflight checks
      run: |
        python -m forgedan.cli suite preflight examples/smoke-suite.yml --output reports/suite-smoke/preflight-smoke
        python -m forgedan.cli suite preflight examples/ready-for-handoff-suite.yml --strict --output reports/suite-smoke/preflight-ready
        python -m forgedan.cli suite validate-report reports/suite-smoke/preflight-smoke/suite-preflight.json
        python -m forgedan.cli suite validate-report reports/suite-smoke/preflight-ready/suite-preflight.json

    - name: Run smoke suite
      run: |
        python -m forgedan.cli suite run examples/smoke-suite.yml --output reports/suite-smoke

    - name: Validate smoke suite report pack
      run: |
        python -m forgedan.cli suite validate-report reports/suite-smoke/suite-result.json
        python -m forgedan.cli suite validate-report reports/suite-smoke/suite-result-redacted.json
        python -m forgedan.cli suite validate-report reports/suite-smoke/suite-config.json
        python -m forgedan.cli suite validate-report reports/suite-smoke/suite-risk-register.json
        python -m forgedan.cli suite validate-report reports/suite-smoke/suite-coverage.json
        python -m forgedan.cli suite validate-report reports/suite-smoke/suite-preflight.json
        python -m forgedan.cli suite verify-bundle reports/suite-smoke/suite-manifest.json
        python -m forgedan.cli suite qa-report reports/suite-smoke/suite-manifest.json --output reports/suite-smoke/qa
        python -m forgedan.cli suite validate-report reports/suite-smoke/qa/suite-qa-receipt.json
        python -m forgedan.cli suite archive reports/suite-smoke/suite-manifest.json --output reports/suite-smoke/handoff.zip
        python -m forgedan.cli suite verify-archive reports/suite-smoke/handoff.zip

    - name: Validate ready-for-handoff report pack
      run: |
        python -m forgedan.cli suite run examples/ready-for-handoff-suite.yml --output reports/suite-ready
        python -m forgedan.cli suite validate-report reports/suite-ready/suite-result.json
        python -m forgedan.cli suite validate-report reports/suite-ready/suite-preflight.json
        python -m forgedan.cli suite verify-bundle reports/suite-ready/suite-manifest.json
        python -m forgedan.cli suite qa-report reports/suite-ready/suite-manifest.json --output reports/suite-ready/qa --strict-handoff
        python -m forgedan.cli suite validate-report reports/suite-ready/qa/suite-qa-receipt.json
        python -m forgedan.cli suite archive reports/suite-ready/suite-manifest.json --output reports/suite-ready/handoff.zip
        python -m forgedan.cli suite verify-archive reports/suite-ready/handoff.zip

    - name: Upload suite report packs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: suite-smoke-${{ matrix.python-version }}
        path: |
          reports/suite-smoke
          reports/suite-ready

    - name: Run linter
      run: |
        pip install flake8
        flake8 forgedan/ --select=E9,F63,F7,F82,E722,F401,F841 --show-source --statistics

    - name: Run formatter check
      run: |
        black --check forgedan tests

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install and build frontend
      run: |
        cd frontend
        npm install
        npm run build
