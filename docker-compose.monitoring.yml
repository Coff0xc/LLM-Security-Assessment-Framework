# Docker Compose configuration for FORGEDAN monitoring services
#
# Included services:
# - Prometheus: metrics collection and storage
# - Grafana: visualization dashboards
# - Alertmanager: alert management (optional)
# - Push Gateway: batch job metrics push (optional)
#
# Usage:
#   Start all services: docker-compose -f docker-compose.monitoring.yml up -d
#   Start only the core services: docker-compose -f docker-compose.monitoring.yml up -d prometheus grafana
#   View logs: docker-compose -f docker-compose.monitoring.yml logs -f
#   Stop services: docker-compose -f docker-compose.monitoring.yml down

version: '3.8'

services:
  # ============== Prometheus ==============
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: forgedan-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Prometheus configuration file
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alert rules
      - ./monitoring/prometheus_rules.yml:/etc/prometheus/rules/forgedan.yml:ro
      # Data persistence
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - forgedan-network
    extra_hosts:
      # Allow access to services on the host machine (Windows/Mac)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============== Grafana ==============
  grafana:
    image: grafana/grafana:10.1.0
    container_name: forgedan-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Administrator account
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=forgedan123
      # Allow anonymous access (optional; recommended to disable in production)
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Server configuration
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      # Logs
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
      # Plugins
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
      # Data source configuration
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Dashboard configuration
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Dashboard files
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Data persistence
      - grafana_data:/var/lib/grafana
    networks:
      - forgedan-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============== Alertmanager (optional) ==============
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: forgedan-alertmanager
    restart: unless-stopped
    profiles:
      - alerting
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address='
    networks:
      - forgedan-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============== Push Gateway (optional) ==============
  pushgateway:
    image: prom/pushgateway:v1.6.2
    container_name: forgedan-pushgateway
    restart: unless-stopped
    profiles:
      - pushgateway
    ports:
      - "9091:9091"
    command:
      - '--persistence.file=/pushgateway/metrics'
      - '--persistence.interval=5m'
    volumes:
      - pushgateway_data:/pushgateway
    networks:
      - forgedan-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============== Network ==============
networks:
  forgedan-network:
    driver: bridge
    name: forgedan-network

# ============== Data volumes ==============
volumes:
  prometheus_data:
    name: forgedan-prometheus-data
  grafana_data:
    name: forgedan-grafana-data
  alertmanager_data:
    name: forgedan-alertmanager-data
  pushgateway_data:
    name: forgedan-pushgateway-data
