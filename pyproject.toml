[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgedan"
version = "1.2.0"
description = "FORGEDAN - LLM Security Assessment Framework based on Evolutionary Algorithms"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Coff0xc"}]

dependencies = [
    "click>=8.0",
    "python-dotenv>=1.0",
    "numpy>=1.21",
    "tqdm>=4.60",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "colorama>=0.4",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
google = ["google-generativeai>=0.5"]
huggingface = [
    "transformers>=4.30",
    "torch>=2.0",
    "accelerate>=0.20",
    "sentence-transformers>=2.2",
]
local = ["ollama>=0.1"]
cn-models = [
    "httpx>=0.24",
    "pyjwt>=2.8",
    "pillow>=9.0",
    "aiofiles>=23.0",
]
web = [
    "flask>=3.0",
    "flask-socketio>=5.3",
    "python-socketio>=5.0",
    "eventlet>=0.33",
    "flask-limiter>=3.0",
    "jinja2>=3.1",
]
monitoring = [
    "prometheus-client>=0.19",
    "opentelemetry-api>=1.20",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
]
all = [
    "forgedan[openai,anthropic,google,huggingface,local,cn-models,web,monitoring,dev]",
]

[project.scripts]
forgedan = "forgedan.cli:cli"

[tool.setuptools.packages.find]
include = ["forgedan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
